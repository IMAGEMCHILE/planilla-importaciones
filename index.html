async function dbCargar() {
  const { data, error } = await sb.from('importaciones').select('*').order('created_at', { ascending: true });
  if (error) { console.error('Error cargando:', error); return null; }
  return data.map(row => ({ ...row.datos, id: row.id, cerrada: row.cerrada }));
}
async function dbGuardar(imp) {
  const payload = {
    id: String(imp.id),
    oc: imp.nro_oc || '',
    proveedor: imp.proveedor || '',
    estado: imp.trans_estado || '',
    origen: imp.origen || '',
    naviera: imp.trans_naviera || '',
    cerrada: imp.cerrada || false,
    datos: imp,
  };
  const { error } = await sb.from('importaciones').upsert(payload, { onConflict: 'id' });
  if (error) console.error('Error guardando:', error);
}
async function dbEliminar(id) {
  const { error } = await sb.from('importaciones').delete().eq('id', String(id));
  if (error) console.error('Error eliminando:', error);
}

const addD = (d, n) => { if (!d) return ""; const x = new Date(d); x.setDate(x.getDate()+n); return x.toISOString().split("T")[0]; };
const addHabil = (d, n) => {
  if (!d) return "";
  const x = new Date(d); let c = 0;
  while (c < n) { x.setDate(x.getDate()-1); const wd = x.getDay(); if (wd !== 0 && wd !== 6) c++; }
  return x.toISOString().split("T")[0];
};

const daysFrom = d => { if (!d) return null; return Math.ceil((new Date(d) - new Date()) / 864e5); };
const parseMonto = s => {
  if (!s) return 0;
  s = String(s).trim();
  // Has comma → dot=thousands, comma=decimal (30.365,97 or 9.400,00)
  if (s.includes(",")) return parseFloat(s.replace(/\./g,"").replace(",",".")) || 0;
  // No comma, has dot → remove ALL dots (9.400 → 9400, 30.365 → 30365)
  if (s.includes(".")) return parseFloat(s.replace(/\./g,"")) || 0;
  return parseFloat(s) || 0;
};

const getAlarms = r => {
  const a = [];
  const chk = (v, l, color) => { if (!v) return; const d = daysFrom(v); if (d !== null && d <= 5) a.push({v, l, d, color}); };
  chk(r.fn_vto, "Fact. Transp. Nacional", "#FEF3C7");
  chk(r.fi_vto, "Fact. Transp. Internacional", "#E0E7FF");
  if (r.trans_eta && !r.aduana_fecha) {
    const p = addHabil(r.trans_eta, 10);
    const d = daysFrom(p);
    if (d !== null && d <= 5) a.push({v:p, l:"Envío docs a aduana", d, color:"#FEE2E2"});
  }
  if (r.trans_eta) {
    (r.prov_fondos || []).forEach((p, i) => {
      if (!p.fecha) {
        const pl = addD(r.trans_eta, -3);
        const d2 = daysFrom(pl);
        if (d2 !== null && d2 <= 5) a.push({v:pl, l:`Pago provisión ${i+1}`, d:d2, color:"#FEF9C3"});
      }
    });
  }
  return a;
};

const canClose = r => {
  const p = getProg(r);
  if (p < 7) return {ok:false, msg:`Progreso incompleto — etapa ${p+1}/9 (${STEPS[p]?.l})`};
  if (!r.invoice_ok || !r.packing_ok || !r.bl_ok || !r.detalle_merc) return {ok:false, msg:"Faltan documentos por confirmar"};
  const archivos = (r.docs_invoice?.length||0) + (r.docs_packing?.length||0) + (r.docs_bl?.length||0);
  if (archivos === 0) return {ok:false, msg:"Falta subir al menos un archivo"};
  if (certRequired(r.origen) && esEuropa(r.origen) && !r.rex_en_invoice) return {ok:false, msg:"Falta confirmar REX en Invoice"};
  if (certRequired(r.origen) && !esEuropa(r.origen) && !r.cert_origen) return {ok:false, msg:"Falta Certificado de Origen"};
  return {ok:true, msg:""};
};

function USDInput({value, onChange}) {
  const handleChange = e => {
    let raw = e.target.value;
    // Allow only digits, dots and commas
    raw = raw.replace(/[^0-9.,]/g, "");
    // Allow at most one comma (decimal separator)
    const parts = raw.split(",");
    if (parts.length > 2) raw = parts[0] + "," + parts.slice(1).join("");
    // Limit decimals to 2 digits
    if (parts.length === 2) raw = parts[0] + "," + parts[1].slice(0,2);
    // Format thousands in integer part with dots
    const intPart = raw.split(",")[0].replace(/\./g,"");
    const decPart = raw.includes(",") ? "," + raw.split(",")[1] : "";
    const formatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + decPart;
    onChange(formatted);
  };
  return <div style={{position:"relative"}}>
    <span style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",fontSize:11,color:"#6b7280",fontWeight:700,pointerEvents:"none"}}>USD</span>
    <input type="text" value={value||""} onChange={handleChange} placeholder="0,00" style={{paddingLeft:38}}/>
  </div>;
}

    {expanded && <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {STEPS.map((s,i) => <div key={i} style={{background:i<=step?s.color:"#f9fafb",border:`1px solid ${i<=step?"#6366f1":"#e5e7eb"}`,borderRadius:8,padding:"6px 10px",minWidth:90,flex:1,opacity:i>step?0.5:1}}>
        <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:3}}>
          <span style={{width:18,height:18,borderRadius:99,background:i<step?"#6366f1":i===step?"#a5b4fc":"#e5e7eb",color:"#fff",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</span>
          <span style={{fontSize:11,fontWeight:700,color:i<=step?s.tc:"#9ca3af"}}>{s.l}</span>
          {i===step && <span style={{fontSize:9,background:"#6366f1",color:"#fff",padding:"1px 5px",borderRadius:99,fontWeight:700}}>ACTUAL</span>}
          {i<step && <span style={{fontSize:9,color:"#166534"}}>✓</span>}
        </div>
        <div style={{fontSize:10,color:"#6b7280",lineHeight:1.4}}>{s.desc}</div>
      </div>)}
    </div>}
  </div>;
}

function RowDetail({row, upd, addDoc, rmDoc, addProv, updProv, delProv, toggleC, delRow, isGestion}) {

      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:8}}>
        <div><div style={{fontSize:11,color:"#6b7280",marginBottom:2,fontWeight:600}}>Origen (país)</div>

        <div><div style={{fontSize:11,color:"#6b7280",marginBottom:2,fontWeight:600}}>Plazo máx. <span style={{color:"#6366f1",fontSize:10}}>(auto)</span></div>

function LoginScreen({onLogin, onPublic}) {
  const [user, setUser] = useState("");

function App() {
  const [data, setData] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [guardando, setGuardando] = useState(false);
  const [errorConex, setErrorConex] = useState(false);
  const [dicc, setDicc] = useState(DICC_INIT);
  const [view, setView] = useState("bodega"); // Vista pública por defecto — sin login
  const [sesion, setSesion] = useState(null);
  const [expR, setExpR] = useState(null);
  const [fE, setFE] = useState("TODOS");
  const [search, setSearch] = useState("");
  const [showProg, setShowProg] = useState({});
  const saveTimer = useRef({});

  useEffect(() => {
    (async () => {
      const rows = await dbCargar();
      if (rows === null) { setErrorConex(true); }
      else setData(rows);
      setCargando(false);
    })();
  }, []);

  const guardarDebounced = useCallback((imp) => {
    const id = imp.id;
    if (saveTimer.current[id]) clearTimeout(saveTimer.current[id]);
    setGuardando(true);
    saveTimer.current[id] = setTimeout(async () => {
      await dbGuardar(imp);
      setGuardando(false);
    }, 1000);
  }, []);

  const upd = (id, k, v) => setData(d => {
    const next = d.map(r => r.id === id ? {...r, [k]:v} : r);
    const updated = next.find(r => r.id === id);
    if (updated) guardarDebounced(updated);
    return next;
  });
  const addRow = () => { const x = newRow(); setData(d => [...d, x]); setExpR(x.id); dbGuardar(x); };
  const delRow = async id => { setData(d => d.filter(r => r.id !== id)); if (expR === id) setExpR(null); await dbEliminar(id); };
  const toggleC = id => setData(d => { const next = d.map(r => r.id === id ? {...r, cerrada:!r.cerrada} : r); const u = next.find(r => r.id === id); if (u) dbGuardar(u); return next; });
  const addDoc = (rid, f, file) => setData(d => { const next = d.map(r => r.id === rid ? {...r, [f]:[...(r[f]||[]),file]} : r); const u = next.find(r => r.id === rid); if (u) guardarDebounced(u); return next; });
  const rmDoc = (rid, f, i) => setData(d => { const next = d.map(r => r.id === rid ? {...r, [f]:(r[f]||[]).filter((_,j) => j !== i)} : r); const u = next.find(r => r.id === rid); if (u) guardarDebounced(u); return next; });
  const addProv = id => setData(d => { const next = d.map(r => r.id === id ? {...r, prov_fondos:[...(r.prov_fondos||[]),{id:Date.now(),numero:"",monto:"",fecha:"",fecha_plazo:""}]} : r); const u = next.find(r => r.id === id); if (u) guardarDebounced(u); return next; });
  const updProv = (rid, pid, k, v) => setData(d => { const next = d.map(r => r.id === rid ? {...r, prov_fondos:(r.prov_fondos||[]).map(p => p.id === pid ? {...p,[k]:v} : p)} : r); const u = next.find(r => r.id === rid); if (u) guardarDebounced(u); return next; });
  const delProv = (rid, pid) => setData(d => { const next = d.map(r => r.id === rid ? {...r, prov_fondos:(r.prov_fondos||[]).filter(p => p.id !== pid)} : r); const u = next.find(r => r.id === rid); if (u) guardarDebounced(u); return next; });

  if (cargando) return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60vh",gap:16}}>
    <div style={{width:40,height:40,border:"4px solid #e5e7eb",borderTop:"4px solid #6366f1",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
    <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    <div style={{fontSize:14,color:"#6b7280",fontWeight:600}}>Cargando datos desde Supabase...</div>
  </div>;

  if (view === "login") return <LoginScreen
    onLogin={u => { setSesion(u); setView("tabla"); }}
    onPublic={() => setView("bodega")}
  />;

  const activas = data.filter(r => !r.cerrada);
  const cerradas = data.filter(r => r.cerrada);
  const filt = activas.filter(r => (fE==="TODOS" || r.trans_estado===fE) &&
    (!search || r.proveedor?.toLowerCase().includes(search.toLowerCase()) || r.nro_oc?.toLowerCase().includes(search.toLowerCase())));
  const cnt = {}; ESTADOS.forEach(e => { cnt[e] = activas.filter(r => r.trans_estado===e).length; });
  const totAlarms = activas.reduce((s,r) => s + getAlarms(r).length, 0);

  const VIEWS_PUBLICAS = [["bodega","📦 Bodega"],["calendario","📅 Calendario"]];
  const VIEWS_PRIVADAS = [["tabla","📋 Gestión"],["alarmas","🔔 Alarmas"],["ranking","📊 Ranking"],["tiempos","⏱ Tiempos"],["cerradas","🔒 Cerradas"],["dicc","📖 Diccionario"],["forwarders","📞 Forwarders"]];

  function CalView() {
    const [yr, setYr] = useState(new Date().getFullYear());

    const fd = new Date(yr,mo,1).getDay(); const dim = new Date(yr,mo+1,0).getDate(); const off = fd===0?6:fd-1;
    const evs = {};

      if (parseInt(y)===yr && parseInt(m)-1===mo) { const day=parseInt(dv); if (!evs[day]) evs[day]=[]; evs[day].push({l,bg,tc}); }};
    activas.forEach(r => {

    });
    const cells = []; for (let i=0;i<off;i++) cells.push(null); for (let dv=1;dv<=dim;dv++) cells.push(dv);
    const today = yr===new Date().getFullYear()&&mo===new Date().getMonth()?new Date().getDate():-1;
    return <div style={{background:"#fff",borderRadius:12,border:"1px solid #e5e7eb",padding:"14px"}}>

          {d && evs[d] && evs[d].length>2 && <div style={{fontSize:10,color:"#9ca3af"}}>+{evs[d].length-2}</div>}
        </div>)}
      </div>
    </div>;
  }

  function TiemposView() {
    const [tab, setTab] = useState("activas");
    const lista = tab === "activas" ? activas : cerradas;
    const calcTramos = r => {
      const t1 = (r.pf_fecha_cot && r.pf_fecha_conf) ? Math.ceil((new Date(r.pf_fecha_conf)-new Date(r.pf_fecha_cot))/864e5) : null;
      const t2 = (r.pf_fecha_conf && r.llegada_fecha) ? Math.ceil((new Date(r.llegada_fecha)-new Date(r.pf_fecha_conf))/864e5) : null;
      const t3 = (r.llegada_fecha && r.pf_fecha_envio) ? Math.ceil((new Date(r.pf_fecha_envio)-new Date(r.llegada_fecha))/864e5) : null;
      const total = (r.pf_fecha_cot && r.pf_fecha_envio) ? Math.ceil((new Date(r.pf_fecha_envio)-new Date(r.pf_fecha_cot))/864e5) : null;
      return {t1,t2,t3,total};
    };
    const conDatos = lista.filter(r => r.pf_fecha_cot || r.llegada_fecha || r.pf_fecha_envio);
    return <div>
      <div style={{fontSize:15,fontWeight:700,marginBottom:2}}>⏱ Tiempos por tramo</div>

      <div style={{display:"flex",gap:4,background:"#f3f4f6",borderRadius:20,padding:3,marginBottom:14,width:"fit-content"}}>
        {[["activas","Activas"],["cerradas","Cerradas"]].map(([k,l]) => (
          <button key={k} onClick={()=>setTab(k)} style={{padding:"4px 14px",borderRadius:16,fontSize:11,background:tab===k?"#6366f1":"transparent",color:tab===k?"#fff":"#6b7280",border:"none",fontWeight:tab===k?700:400}}>{l}</button>
        ))}
      </div>
      <div style={{display:"grid",gap:6,marginBottom:12}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",gap:6,padding:"6px 10px",background:"#f9fafb",borderRadius:8,fontWeight:700,fontSize:11,color:"#6b7280"}}>
          <div>Importación</div>
          <div style={{textAlign:"center"}}>📋→✅<br/><span style={{fontSize:10,fontWeight:400}}>Cotiz. → Confirm.</span></div>
          <div style={{textAlign:"center"}}>✅→📦<br/><span style={{fontSize:10,fontWeight:400}}>Confirm. → Llegada</span></div>
          <div style={{textAlign:"center"}}>📦→🧾<br/><span style={{fontSize:10,fontWeight:400}}>Llegada → OC</span></div>
          <div style={{textAlign:"center"}}>⏱ Total</div>
        </div>
        {conDatos.length === 0 && <div style={{textAlign:"center",padding:30,color:"#9ca3af",fontSize:13}}>Sin fechas registradas aún.</div>}
        {conDatos.map(r => {
          const {t1,t2,t3,total} = calcTramos(r);
          const colorT = n => n===null?"#9ca3af":n<=5?"#166534":n<=15?"#854F0B":"#991B1B";
          const bgT = n => n===null?"#f3f4f6":n<=5?"#DCFCE7":n<=15?"#FEF3C7":"#FEE2E2";
          return <div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",gap:6,padding:"8px 10px",background:"#fff",borderRadius:8,border:"1px solid #e5e7eb",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:700,fontSize:12}}>{r.proveedor||"—"}</div>
              {r.nro_oc && <span style={{fontSize:10,background:"#F5F3FF",color:"#5B21B6",padding:"1px 6px",borderRadius:99}}>{r.nro_oc}</span>}
            </div>
            {[t1,t2,t3].map((v,i) => <div key={i} style={{textAlign:"center",background:bgT(v),borderRadius:6,padding:"4px",color:colorT(v),fontWeight:700,fontSize:12}}>
              {v!==null?`${v}d`:"—"}
            </div>)}
            <div style={{textAlign:"center",background:total!==null?"#EDE9FE":"#f3f4f6",borderRadius:6,padding:"4px",color:total!==null?"#4338ca":"#9ca3af",fontWeight:700,fontSize:13}}>
              {total!==null?`${total}d`:"—"}
            </div>
          </div>;
        })}
      </div>
      <div style={{fontSize:11,color:"#9ca3af",padding:"6px 10px",background:"#f9fafb",borderRadius:8}}>
        🟢 ≤5d · 🟡 ≤15d · 🔴 &gt;15d · Los tiempos se calculan automáticamente con las fechas ingresadas.
      </div>
    </div>;
  }

  function DiccView() {
    const [q, setQ] = useState(""); const [editing, setEditing] = useState(null);

    const items = q ? dicc.filter(d => d.t.toLowerCase().includes(q.toLowerCase()) || d.d.toLowerCase().includes(q.toLowerCase())) : dicc;
    const saveEdit = i => { setDicc(d => d.map((x,idx) => idx===i ? {t:x._et||x.t,d:x._ed||x.d} : x)); setEditing(null); };
    const startEdit = i => { setDicc(d => d.map((x,idx) => idx===i ? {...x,_et:x.t,_ed:x.d} : x)); setEditing(i); };
    const delTerm = i => setDicc(d => d.filter((_,idx) => idx!==i));
    const addTerm = () => { if (!newT.trim()) return; setDicc(d => [...d,{t:newT.trim(),d:newD.trim()}]); setNewT(""); setNewD(""); setShowAdd(false); };
    return <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:8}}>
        <div><div style={{fontSize:15,fontWeight:700}}>📖 Diccionario</div><div style={{fontSize:12,color:"#6b7280"}}>Editable</div></div>

          <div><div style={{fontSize:11,color:"#6b7280",marginBottom:2,fontWeight:600}}>Término</div><input value={newT} onChange={e=>setNewT(e.target.value)} placeholder="Ej: FOB"/></div>
          <div><div style={{fontSize:11,color:"#6b7280",marginBottom:2,fontWeight:600}}>Definición</div><input value={newD} onChange={e=>setNewD(e.target.value)} placeholder="Explicación..."/></div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={addTerm} style={{padding:"5px 14px",borderRadius:6,background:"#6366f1",color:"#fff",border:"none",fontSize:12,fontWeight:700}}>Guardar</button>
          <button onClick={()=>{setShowAdd(false);setNewT("");setNewD("");}} style={{padding:"5px 14px",borderRadius:6,background:"#fff",color:"#6b7280",border:"1px solid #d1d5db",fontSize:12}}>Cancelar</button>
        </div>
      </div>}
      <input placeholder="Buscar..." value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:12,maxWidth:300}}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:8}}>
        {items.map((d,i) => { const ri = dicc.indexOf(d); return editing===ri ? (
          <div key={ri} style={{background:"#fff",borderRadius:10,border:"2px solid #6366f1",padding:"12px"}}>
            <div style={{marginBottom:6}}><div style={{fontSize:11,color:"#6b7280",marginBottom:2,fontWeight:600}}>Término</div>
              <input value={d._et||d.t} onChange={e=>setDicc(dv=>dv.map((x,idx)=>idx===ri?{...x,_et:e.target.value}:x))}/></div>
            <div style={{marginBottom:8}}><div style={{fontSize:11,color:"#6b7280",marginBottom:2,fontWeight:600}}>Definición</div>
              <textarea rows={3} value={d._ed||d.d} onChange={e=>setDicc(dv=>dv.map((x,idx)=>idx===ri?{...x,_ed:e.target.value}:x))} style={{resize:"vertical"}}/></div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>saveEdit(ri)} style={{padding:"4px 12px",borderRadius:6,background:"#6366f1",color:"#fff",border:"none",fontSize:11,fontWeight:700}}>✓ Guardar</button>
              <button onClick={()=>{setEditing(null);setDicc(dv=>dv.map((x,idx)=>idx===ri?{t:x.t,d:x.d}:x));}} style={{padding:"4px 12px",borderRadius:6,background:"#fff",color:"#6b7280",border:"1px solid #d1d5db",fontSize:11}}>Cancelar</button>
            </div>
          </div>
        ) : (
          <div key={ri} style={{background:"#fff",borderRadius:10,border:"1px solid #e5e7eb",padding:"12px"}}>
            <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:6,marginBottom:4}}>
              <div style={{fontSize:13,fontWeight:700,color:"#4338ca"}}>{d.t}</div>
              <div style={{display:"flex",gap:4,flexShrink:0}}>
                <button onClick={()=>startEdit(ri)} style={{background:"none",border:"none",color:"#6366f1",fontSize:13,padding:"0 3px"}}>✏️</button>
                <button onClick={()=>delTerm(ri)} style={{background:"none",border:"none",color:"#ef4444",fontSize:13,padding:"0 3px"}}>✕</button>
              </div>
            </div>
            <div style={{fontSize:12,color:"#374151",lineHeight:1.5}}>{d.d}</div>
          </div>

      </div>
    </div>;

      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        {sesion && <button onClick={()=>{setSesion(null);setView("bodega");}}
          style={{fontSize:11,padding:"4px 12px",borderRadius:6,border:"1px solid #d1d5db",background:"#fff",color:"#6b7280"}}>
          Cerrar sesión
        </button>}
        {!sesion && <button onClick={()=>setView("login")}
          style={{fontSize:11,padding:"4px 12px",borderRadius:6,border:"none",background:"#6366f1",color:"#fff",fontWeight:700}}>
          🔐 Ingresar
        </button>}
        {errorConex && <span style={{fontSize:11,background:"#FEE2E2",color:"#991B1B",padding:"3px 10px",borderRadius:99,fontWeight:600}}>⚠ Sin conexión</span>}
        {!errorConex && guardando && <span style={{fontSize:11,background:"#FEF3C7",color:"#854F0B",padding:"3px 10px",borderRadius:99,fontWeight:600}}>💾 Guardando...</span>}
        {!errorConex && !guardando && sesion && <span style={{fontSize:11,background:"#DCFCE7",color:"#166534",padding:"3px 10px",borderRadius:99,fontWeight:600}}>✓ Guardado</span>}
        <div style={{display:"flex",gap:3,background:"#e5e7eb",borderRadius:22,padding:3,flexWrap:"wrap"}}>
          {VIEWS_PUBLICAS.map(([k,l]) => (
            <button key={k} onClick={()=>setView(k)} style={{padding:"5px 11px",borderRadius:20,fontSize:11,background:view===k?"#6366f1":"transparent",color:view===k?"#fff":"#6b7280",border:"none",fontWeight:view===k?700:400}}>{l}</button>
          ))}
          {sesion && VIEWS_PRIVADAS.map(([k,l]) => (
            <button key={k} onClick={()=>setView(k)} style={{padding:"5px 11px",borderRadius:20,fontSize:11,background:view===k?"#6366f1":"transparent",color:view===k?"#fff":"#6b7280",border:"none",fontWeight:view===k?700:400,position:"relative"}}>
              {l}{k==="alarmas" && totAlarms>0 && <span style={{position:"absolute",top:-3,right:-2,background:"#EF4444",color:"#fff",borderRadius:99,fontSize:9,fontWeight:700,padding:"0 4px",lineHeight:"14px"}}>{totAlarms}</span>}
            </button>
          ))}
        </div>
      </div>
    </div>

    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
      {[{l:"Activas",v:activas.length,bg:"#f3f4f6",tc:"#374151"},
        {l:"Producción",v:cnt["EN PRODUCCIÓN"]||0,bg:"#FEF08A",tc:"#713F12"},
        {l:"Tránsito",v:(cnt["EN TRÁNSITO"]||0)+(cnt["BOOKING CONFIRMADO"]||0),bg:"#A5F3FC",tc:"#0F6E56"},
        {l:"Aduana",v:cnt["EN ADUANA"]||0,bg:"#FED7AA",tc:"#854F0B"},
        {l:"Entregados",v:cnt["ENTREGADO"]||0,bg:"#BBF7D0",tc:"#166534"},
        {l:"Cerradas",v:cerradas.length,bg:"#F3F4F6",tc:"#6b7280"},
      ].map(k => <div key={k.l} style={{background:k.bg,borderRadius:8,padding:"5px 14px",minWidth:75,textAlign:"center",border:"1px solid #e5e7eb"}}>
        <div style={{fontSize:20,fontWeight:700,color:k.tc}}>{k.v}</div>
        <div style={{fontSize:11,color:k.tc}}>{k.l}</div>
      </div>)}
    </div>

    {view==="bodega" && <BodegaView/>}
    {view==="calendario" && <CalView/>}
    {sesion && view==="alarmas" && <div><div style={{fontSize:14,fontWeight:700,marginBottom:10}}>🔔 Alarmas y plazos</div><AlarmsView/></div>}
    {sesion && view==="ranking" && <RankingView/>}
    {sesion && view==="tiempos" && <TiemposView/>}
    {sesion && view==="dicc" && <DiccView/>}
    {sesion && view==="cerradas" && <CerradasView/>}
    {sesion && view==="forwarders" && <ForwarderView/>}

    {sesion && view==="tabla" && <>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
        <input placeholder="Buscar proveedor o N° OC..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:220}}/>
        <select value={fE} onChange={e=>setFE(e.target.value)} style={{width:"auto"}}>
          <option value="TODOS">Todos los estados</option>
          {ESTADOS.map(e => <option key={e}>{e}</option>)}
        </select>
        <button onClick={addRow} style={{marginLeft:"auto",padding:"6px 14px",borderRadius:6,background:"#6366f1",color:"#fff",border:"none",fontSize:12,fontWeight:700}}>+ Nueva importación</button>
      </div>
      <div style={{overflowX:"auto",borderRadius:10,border:"1px solid #e5e7eb",background:"#fff"}}>
        <table style={{width:"100%"}}>
          <thead>
            <tr style={{background:"#f9fafb",borderBottom:"2px solid #e5e7eb"}}>
              {["","Proveedor","N° OC","Origen","Contenedor","Estado","ETD","ETA","Progreso","Docs","Llegada","🔔",""].map((h,i) => (
                <th key={i} style={{padding:"7px 9px",textAlign:"left",fontSize:11,fontWeight:700,color:"#6b7280",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filt.map((row,idx) => {
              const p = getProg(row); const isE = expR===row.id;
              const dc = [row.invoice_ok,row.packing_ok,row.bl_ok,row.detalle_merc,
                row.origen==="USA"?true:esEuropa(row.origen)?row.rex_en_invoice:row.cert_origen].filter(Boolean).length;
              const al = getAlarms(row);
              return <React.Fragment key={row.id}>
                <tr style={{borderBottom:"1px solid #f3f4f6",background:idx%2===0?"#fff":"#fafafa",cursor:"pointer"}} onClick={()=>setExpR(isE?null:row.id)}>
                  <td style={{padding:"6px 8px",color:"#9ca3af",fontSize:11}}>{isE?"▼":"▶"}</td>
                  <td style={{padding:"6px 9px",fontWeight:700,whiteSpace:"nowrap"}}>{row.proveedor||<span style={{color:"#9ca3af"}}>—</span>}</td>
                  <td style={{padding:"6px 9px"}}>{row.nro_oc?<span style={{background:"#F5F3FF",color:"#5B21B6",fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:99}}>{row.nro_oc}</span>:<span style={{color:"#9ca3af"}}>—</span>}</td>
                  <td style={{padding:"6px 9px"}}>{row.origen?<span style={{background:"#F0FDF4",color:"#166534",fontSize:11,fontWeight:600,padding:"2px 7px",borderRadius:99}}>{row.origen}</span>:<span style={{color:"#9ca3af"}}>—</span>}</td>
                  <td style={{padding:"6px 9px"}}>{row.contenedor?<span style={{background:"#E0E7FF",color:"#3730a3",fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:99}}>{row.contenedor}</span>:<span style={{color:"#9ca3af"}}>—</span>}</td>
                  <td style={{padding:"6px 9px"}}><Bdg e={row.trans_estado}/></td>
                  <td style={{padding:"6px 9px",fontSize:12,color:"#6b7280"}}>{fmt(row.trans_etd)}</td>
                  <td style={{padding:"6px 9px",fontSize:12,color:"#6b7280"}}>{fmt(row.trans_eta)}</td>
                  <td style={{padding:"6px 9px",minWidth:150,cursor:"pointer"}} onClick={e=>{e.stopPropagation();setShowProg(s=>({...s,[row.id]:!s[row.id]}));}}>
                    <div style={{display:"flex",gap:1,marginBottom:2}}>
                      {STEPS.map((_,i) => <div key={i} style={{flex:1,height:6,borderRadius:2,background:i<p?"#6366f1":i===p?"#a5b4fc":"#e5e7eb"}}/>)}
                    </div>
                    <div style={{fontSize:10,color:"#6366f1",fontWeight:600}}>{p+1}. {STEPS[p]?.l} · detalle</div>
                  </td>
                  <td style={{padding:"6px 9px"}}><span style={{fontSize:12,fontWeight:700,color:dc===5?"#166534":dc>0?"#854F0B":"#9ca3af"}}>{dc}/5</span></td>
                  <td style={{padding:"6px 9px",fontSize:12,color:row.llegada_fecha?"#166534":"#9ca3af",fontWeight:row.llegada_fecha?700:400}}>
                    {row.llegada_fecha?fmt(row.llegada_fecha):row.trans_eta?`Est. ${fmt(row.trans_eta)}`:"—"}</td>
                  <td style={{padding:"6px 9px"}}>{al.length>0 && <span style={{background:"#FEE2E2",color:"#991B1B",fontSize:11,fontWeight:700,padding:"1px 7px",borderRadius:99}}>🔔 {al.length}</span>}</td>
                  <td style={{padding:"6px 8px"}} onClick={e=>e.stopPropagation()}>
                    <button onClick={()=>toggleC(row.id)} title="Cerrar" style={{background:"none",border:"none",color:"#6b7280",fontSize:13,padding:"0 3px"}}>🔒</button>
                    <button onClick={()=>delRow(row.id)} style={{background:"none",border:"none",color:"#ef4444",fontSize:13,padding:"0 3px"}}>✕</button>
                  </td>
                </tr>
                {showProg[row.id] && !isE && <tr><td colSpan={13} style={{padding:0,background:"#f8f7ff"}}>
                  <div style={{padding:"10px 14px"}}><ProgBar step={p} expanded={true}/></div>
                </td></tr>}
                {isE && <tr><td colSpan={13} style={{padding:0,background:"#f5f3ff",borderBottom:"2px solid #e5e7eb"}}>
                  <RowDetail row={row} upd={upd} addDoc={addDoc} rmDoc={rmDoc} addProv={addProv} updProv={updProv} delProv={delProv} toggleC={toggleC} delRow={delRow} isGestion={true}/>
                </td></tr>}
              </React.Fragment>;
            })}
          </tbody>
        </table>
      </div>
      <p style={{marginTop:6,fontSize:11,color:"#9ca3af"}}>{filt.length} de {activas.length} importaciones activas</p>
    </>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
